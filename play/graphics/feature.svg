<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173F73"/><stop offset="1" stop-color="#1F5FA8"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="500" fill="url(#bg)"/>
  <!-- rain streaks -->
  <g stroke="#9CC7FF" stroke-opacity="0.25" stroke-width="4" stroke-linecap="round">
    <line x1="620" y1="40" x2="608" y2="84"/><line x1="700" y1="120" x2="688" y2="164"/><line x1="790" y1="60" x2="778" y2="104"/>
    <line x1="880" y1="150" x2="868" y2="194"/><line x1="960" y1="70" x2="948" y2="114"/><line x1="660" y1="260" x2="648" y2="304"/>
    <line x1="840" y1="300" x2="828" y2="344"/><line x1="930" y1="380" x2="918" y2="424"/><line x1="560" y1="400" x2="548" y2="444"/>
  </g>
  <!-- the app's probability strip -->
  <g fill="#9CC7FF">
    <rect x="96" y="380" width="22" height="14" rx="5" fill-opacity="0.20"/><rect x="124" y="380" width="22" height="14" rx="5" fill-opacity="0.30"/>
    <rect x="152" y="380" width="22" height="14" rx="5" fill-opacity="0.45"/><rect x="180" y="380" width="22" height="14" rx="5" fill-opacity="0.65"/>
    <rect x="208" y="380" width="22" height="14" rx="5" fill-opacity="0.85"/><rect x="236" y="380" width="22" height="14" rx="5" fill-opacity="0.95"/>
    <rect x="264" y="380" width="22" height="14" rx="5" fill-opacity="0.80"/><rect x="292" y="380" width="22" height="14" rx="5" fill-opacity="0.60"/>
    <rect x="320" y="380" width="22" height="14" rx="5" fill-opacity="0.40"/><rect x="348" y="380" width="22" height="14" rx="5" fill-opacity="0.25"/>
  </g>
  <!-- the drop -->
  <g transform="translate(96 96) scale(2.6) translate(-39 -30)">
    <path fill="#FFFFFF" fill-opacity="0.95" d="M54,30C54,30 39,46.5 39,57.5A15,15 0,0 0,69 57.5C69,46.5 54,30 54,30Z"/>
  </g>
  <text x="200" y="168" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="72" font-weight="700" fill="#FFFFFF">Rain Nowcast</text>
  <text x="200" y="230" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="34" fill="#DCEBFF">Rain, minute by minute,</text>
  <text x="200" y="274" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="34" fill="#DCEBFF">worked out on your phone from live radar.</text>
