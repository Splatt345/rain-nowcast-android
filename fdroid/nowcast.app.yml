# Draft for fdroiddata: copy to metadata/<applicationId>.yml in your fork of
# https://gitlab.com/fdroid/fdroiddata.
# Description, summary and screenshots come from fastlane/ in the app's repo.
Categories:
  - Weather
License: GPL-3.0-or-later
AuthorName: Splatt345
SourceCode: https://github.com/Splatt345/rain-nowcast-android
IssueTracker: https://github.com/Splatt345/rain-nowcast-android/issues

AutoName: Rain Nowcast

RepoType: git
Repo: https://github.com/Splatt345/rain-nowcast-android.git

# One APK per ABI (app/build.gradle.kts splits): versionCode * 10 + 2 for arm64-v8a, + 4 for x86_64.
Builds:
  - versionName: 1.0.0
    versionCode: 12
    commit: v1.0.0
    subdir: app
    gradle:
      - yes
    output: build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk

  - versionName: 1.0.0
    versionCode: 14
    commit: v1.0.0
    subdir: app
    gradle:
      - yes
    output: build/outputs/apk/release/app-x86_64-release-unsigned.apk

AutoUpdateMode: Version
UpdateCheckMode: Tags
VercodeOperation:
  - 10*%c+2
  - 10*%c+4
CurrentVersion: 1.0.0
CurrentVersionCode: 14
